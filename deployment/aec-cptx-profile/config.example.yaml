# Sanitized Hermes profile config excerpt for the remote AEC CPTX demo deployment.
# Sanitized from a working Windows profile. No host or username is required.
# Do not commit live config.yaml, .env, auth files, state.db, sessions, logs, caches, or DML runtime stores.

model:
  default: aws/anthropic/claude-opus-4-5
  provider: custom:nvidia_claude
  openai_runtime: auto
  context_length: 200000
  max_tokens: 32768
  supports_vision: true

custom_providers:
  - name: nvidia_claude
    base_url: https://inference-api.nvidia.com/v1
    api_mode: chat_completions
    key_env: NVIDIA_API_KEY
    model: aws/anthropic/claude-opus-4-5
    models:
      aws/anthropic/claude-opus-4-5:
        context_length: 200000
        supports_vision: true
  - name: nvidia_omni
    base_url: https://inference-api.nvidia.com/v1
    api_mode: chat_completions
    key_env: NVIDIA_API_KEY
    model: nvidia/nvidia/nemotron-3-nano-omni-30b-a3b-reasoning
    extra_body:
      chat_template_kwargs:
        enable_thinking: false
    models:
      nvidia/nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:
        context_length: 262144
        supports_vision: true
  - name: vllm_local
    base_url: http://localhost:8000/v1
    api_mode: chat_completions
    model: nvidia/Qwen3.6-35B-A3B-NVFP4
    extra_body:
      chat_template_kwargs:
        enable_thinking: false
    models:
      nvidia/Qwen3.6-35B-A3B-NVFP4:
        context_length: 262144
        supports_vision: true

agent:
  max_turns: 60
  max_turns_auto_extend: true
  max_turns_extension_policy: cognition
  max_turns_extension: 30
  max_turns_hard_cap: 120
  reasoning_effort: low

compression:
  enabled: true
  threshold: 0.85
  target_ratio: 0.2
  protect_last_n: 4
  hygiene_hard_message_limit: 400
  protect_first_n: 0
  dml_first: true
  dml_first_tail_ratio: 0.02
  abort_on_summary_failure: false
  codex_gpt55_autoraise: true
  preserve_first_n_turns: 0

auxiliary:
  vision:
    provider: custom:nvidia_omni
    model: nvidia/nvidia/nemotron-3-nano-omni-30b-a3b-reasoning
  compression:
    provider: main
    reasoning_effort: low
  title_generation:
    provider: main
  web_extract:
    provider: main
  goal_judge:
    provider: main
  approval:
    provider: main
  mcp:
    provider: main
  skills_hub:
    provider: main
  profile_describer:
    provider: main
  triage_specifier:
    provider: main
  kanban_decomposer:
    provider: main
  curator:
    provider: main
  tts_audio_tags:
    provider: main

memory:
  memory_enabled: true
  memory_char_limit: 2200
  # Disable post-turn background review forks during deterministic demos.
  nudge_interval: 0
  provider: daystrom_dml
  daystrom_dml:
    retrieval_policy: always
    top_k: 3
    max_context_chars: 2200
    fast_retrieval: true
    preflight_strict: true
    timeout_seconds: 60
    # Valid DCN modes: active_read, active_learn, observe_only, disabled.
    # Active reads accelerate the run; durable writes are explicit after validation.
    sync_turns: false
    dcn:
      mode: active_read

skills:
  creation_nudge_interval: 0

plugins:
  enabled:
    - daystrom_dml

sessions:
  write_json_snapshots: true

model_catalog:
  enabled: true
  url: https://hermes-agent.nousresearch.com/docs/api/model-catalog.json
  ttl_hours: 1
