# Sanitized Hermes profile config excerpt for the BAC_Teapot profile.
# Sanitized from a working Windows profile. No host or username is required.
# Do not commit live config.yaml, .env, auth files, state.db, sessions, logs, caches, or DML runtime stores.
#
# BAC_Teapot was created via `hermes profile create BAC_Teapot --clone`, cloning
# config, .env, SOUL.md, and skills from the `default` profile (2026-07-10).
# It is functionally identical to `default` at creation time — same model,
# same Daystrom DML/DCN memory posture, same skill set — distinguished only
# by having its own isolated sessions/memories/skills going forward and its
# own dedicated Desktop launcher (see deployment/windows-launchers/BAC_Teapot.bat).

model:
  # Cloned from default at creation time. Set/override locally with
  # `hermes -p bac_teapot model` or `hermes -p bac_teapot config set ...`.
  provider: custom:vllm_local
  default: nvidia/Qwen3.6-35B-A3B-NVFP4
  base_url: http://localhost:8000/v1
  api_key: ${AEC_DEMO_MODEL_API_KEY}

agent:
  max_turns: 60
  gateway_timeout: 1800
  restart_drain_timeout: 180
  api_max_retries: 3
  max_turns_auto_extend: true

compression:
  enabled: true
  threshold: 0.5
  target_ratio: 0.2
  protect_last_n: 4
  protect_first_n: 0
  dml_first: true
  dml_first_tail_ratio: 0.02
  hygiene_hard_message_limit: 400
  abort_on_summary_failure: false

# Auxiliary LLM tasks pinned per-task, same pattern as the aec-cptx profile.
# Vision runs against a local vLLM endpoint; the rest resolve to the
# NVIDIA-compatible custom endpoint. API keys live only in the live
# profile config/.env, never here.
auxiliary:
  vision:
    provider: custom:vllm_vision
    model: nvidia/Nemotron-3-Nano-Omni-30B-A3B-Reasoning-NVFP4
    base_url: http://localhost:8001/v1
    temperature: 0.2
    max_tokens: 512
    extra_body:
      top_k: 1
      chat_template_kwargs:
        enable_thinking: false
  web_extract:
    provider: custom:nvidia
    model: aws/anthropic/bedrock-claude-sonnet-5
    base_url: https://inference-api.nvidia.com/v1
  compression:
    provider: custom:nvidia
    model: aws/anthropic/bedrock-claude-sonnet-5
    base_url: https://inference-api.nvidia.com/v1
  skills_hub:
    provider: custom:nvidia
    model: aws/anthropic/bedrock-claude-sonnet-5
    base_url: https://inference-api.nvidia.com/v1
  approval:
    provider: custom:nvidia
    model: aws/anthropic/bedrock-claude-sonnet-5
    base_url: https://inference-api.nvidia.com/v1

# Daystrom DML/DCN memory posture — permanently enforced across all
# profiles on this machine as of 2026-07-10 (see root README's DML/DCN
# posture section). Verified live via `hermes memory status --profile
# BAC_Teapot`: Provider: daystrom_dml, Plugin: installed, Status:
# available, daystrom_dml <- active.
memory:
  memory_enabled: true
  user_profile_enabled: true
  provider: daystrom_dml
  nudge_interval: 0
  daystrom_dml:
    retrieval_policy: always
    top_k: 8
    max_context_chars: 3200
    preflight_strict: true
    timeout_seconds: 20
    # Valid DCN modes: active_read, active_learn, observe_only, disabled.
    dcn:
      mode: active_read

plugins:
  enabled:
    - daystrom_dml
    - teapot_execution_rails
  disabled: []

skills:
  creation_nudge_interval: 0

sessions:
  write_json_snapshots: true

providers:
  nvidia:
    name: NVIDIA NIM
    api: https://inference-api.nvidia.com/v1
    key_env: NVIDIA_API_KEY
    default_model: nvidia/zai-org/glm-5.2
    transport: chat_completions

model_catalog:
  enabled: true
  url: https://hermes-agent.nousresearch.com/docs/api/model-catalog.json
  ttl_hours: 1

mcp_servers:
  blender:
    command: cmd
    args: [/c, uvx, blender-mcp]
    env:
      BLENDER_HOST: localhost
      BLENDER_PORT: "9876"
      DISABLE_TELEMETRY: "true"
  daystrom_dml:
    command: cmd
    args: [/c, C:/Users/USER/AppData/Local/hermes/integrations/daystrom-dml/bin/dml_mcp_server_teapot.cmd]
  cma:
    command: cmd
    args: [/c, C:/Users/USER/AppData/Local/hermes/integrations/daystrom-dml/bin/cma_mcp_server_teapot.cmd]
